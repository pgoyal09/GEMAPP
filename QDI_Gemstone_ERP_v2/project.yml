name: QDI_Gemstone_ERP_v2
options:
  bundleIdPrefix: com.qdi.gemapp
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ORSSerialPort:
    url: https://github.com/armadsen/ORSSerialPort
    majorVersion: 2.1.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: YES

targets:
  QDI_Gemstone_ERP_v2:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: API
      - path: Models
      - path: Services
      - path: Utilities
      - path: DesignSystem
      - path: ViewModels
      - path: Views
    resources:
      - path: Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.business"
        INFOPLIST_KEY_CFBundleDisplayName: "QDI Gemstone ERP"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Quality Diajewels Inc. All rights reserved."
        CODE_SIGN_ENTITLEMENTS: Resources/QDI_Gemstone_ERP_v2.entitlements
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.qdi.gemapp.v2
        PRODUCT_NAME: "QDI Gemstone ERP v2"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: ORSSerialPort
        product: ORSSerial
      - package: Supabase
        product: Supabase
    entitlements:
      path: Resources/QDI_Gemstone_ERP_v2.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.device.serial: true
        com.apple.security.files.user-selected.read-write: true
  QDI_Gemstone_ERP_v2Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QDI_Gemstone_ERP_v2Tests
    dependencies:
      - target: QDI_Gemstone_ERP_v2
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        BUNDLE_LOADER: "$(BUILT_PRODUCTS_DIR)/QDI Gemstone ERP v2.app/Contents/MacOS/QDI Gemstone ERP v2"
        TEST_HOST: "$(BUNDLE_LOADER)"

schemes:
  QDI_Gemstone_ERP_v2:
    build:
      targets:
        QDI_Gemstone_ERP_v2: all
        QDI_Gemstone_ERP_v2Tests: [test]
    test:
      targets:
        - QDI_Gemstone_ERP_v2Tests
